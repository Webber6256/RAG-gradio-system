services:
  - type: web
    name: rag-doc-qa-pwa
    runtime: python
    plan: starter            # torch + 嵌入模型需要約 1GB 以上記憶體，免費 512MB 方案很可能不夠
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-small')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME            # 模型在 build 階段下載到專案目錄，啟動時不必再下載
        value: /opt/render/project/src/.hf_cache
      - key: GROQ_API_KEY       # 選填：不設則每位使用者自行在畫面輸入自己的 Key
        sync: false
      - key: ALLOW_SERVER_KEY   # 1＝沒填 Key 的人使用伺服器 Key；公開網站建議設 0
        value: "1"
